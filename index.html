<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Привет, Аленка!</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffd1e8 0%, #ffb3d9 50%, #ff9ecb 100%);
    font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  /* Плавающие стикеры-котята на фоне */
  .sticker {
    position: absolute;
    font-size: 60px;
    opacity: 0.55;
    animation: float 6s ease-in-out infinite;
    user-select: none;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(255, 105, 180, 0.4));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50%      { transform: translateY(-25px) rotate(8deg); }
  }

  .s1  { top: 5%;  left: 5%;  animation-delay: 0s;   font-size: 70px; }
  .s2  { top: 15%; right: 8%; animation-delay: 1s;   font-size: 55px; }
  .s3  { bottom: 10%; left: 10%; animation-delay: 2s; font-size: 65px; }
  .s4  { bottom: 8%; right: 12%; animation-delay: 0.5s; font-size: 75px; }
  .s5  { top: 45%; left: 3%;  animation-delay: 1.5s; font-size: 50px; }
  .s6  { top: 40%; right: 4%; animation-delay: 2.5s; font-size: 60px; }
  .s7  { top: 70%; left: 45%; animation-delay: 3s;   font-size: 45px; }
  .s8  { top: 2%;  left: 45%; animation-delay: 1.8s; font-size: 55px; }
  .s9  { bottom: 25%; right: 40%; animation-delay: 0.8s; font-size: 50px; }
  .s10 { top: 25%; left: 30%; animation-delay: 2.2s; font-size: 40px; }

  /* Заголовок */
  h1 {
    color: #d63384;
    font-size: 2.4rem;
    text-align: center;
    text-shadow: 2px 2px 0 #fff, 4px 4px 8px rgba(214, 51, 132, 0.3);
    margin-bottom: 40px;
    z-index: 2;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  /* Кнопка */
  .btn {
    background: linear-gradient(145deg, #ff69b4, #ff1493);
    color: white;
    border: 4px solid #fff;
    border-radius: 50px;
    padding: 22px 42px;
    font-size: 1.3rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 20, 147, 0.5),
                inset 0 -4px 0 rgba(0, 0, 0, 0.1);
    transition: all 0.25s ease;
    z-index: 3;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
    max-width: 90%;
    line-height: 1.3;
  }

  .btn:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 12px 28px rgba(255, 20, 147, 0.7),
                inset 0 -4px 0 rgba(0, 0, 0, 0.1);
  }

  .btn:active {
    transform: translateY(2px) scale(0.98);
  }

  /* Скрытый текст */
  .message {
    margin-top: 35px;
    background: rgba(255, 255, 255, 0.9);
    border: 4px dashed #ff69b4;
    border-radius: 30px;
    padding: 30px 40px;
    font-size: 1.5rem;
    color: #c2185b;
    text-align: center;
    max-width: 650px;
    line-height: 1.6;
    box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
    opacity: 0;
    transform: scale(0.7) translateY(20px);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 2;
    position: relative;
  }

  .message.show {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }

  .message::before,
  .message::after {
    content: '🐱';
    position: absolute;
    font-size: 2rem;
  }
  .message::before { top: -20px; left: 15px; }
  .message::after  { bottom: -20px; right: 15px; }

  @media (max-width: 600px) {
    h1 { font-size: 1.7rem; }
    .btn { font-size: 1rem; padding: 18px 28px; }
    .message { font-size: 1.15rem; padding: 22px 24px; }
    .sticker { font-size: 40px !important; }
  }
</style>
</head>
<body>

  <!-- Фоновые стикеры-котята -->
  <div class="sticker s1">🐱</div>
  <div class="sticker s2">😺</div>
  <div class="sticker s3">😸</div>
  <div class="sticker s4">🐈</div>
  <div class="sticker s5">😻</div>
  <div class="sticker s6">🐾</div>
  <div class="sticker s7">😽</div>
  <div class="sticker s8">🐱</div>
  <div class="sticker s9">🎀</div>
  <div class="sticker s10">💖</div>

  <h1>🐾 Мур-мур, это для тебя! 🐾</h1>

  <button class="btn" id="magicBtn">
    привет, Аленка, я намутила тебе сайт
  </button>

  <div class="message" id="msg">
    я не хочу фигней страдать в экселе со всеми вот этими вот кодами,<br>
    давай лучше фигней страдать, улыбнись 😊💕
  </div>

<script>
  const btn = document.getElementById('magicBtn');
  const msg = document.getElementById('msg');

  btn.addEventListener('click', () => {
    msg.classList.toggle('show');
    if (msg.classList.contains('show')) {
      btn.textContent = 'ещё разок? 💗';
    } else {
      btn.textContent = 'привет, Аленка, я намутила тебе сайт';
    }
  });
</script>

</body>
</html>
