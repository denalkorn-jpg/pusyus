<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Благодарность</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Arial, sans-serif;
        position: relative;
        overflow: hidden;
        text-align: center;
        padding: 20px;
    }

    /* Флаг Боснии и Герцеговины как фон */
    .flag-bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: #002F6C; /* синий фон флага */
    }

    /* Жёлтый треугольник флага БиГ */
    .flag-bg::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 100%;
        height: 100%;
        background: #FECB00;
        clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    /* Белые звёзды вдоль гипотенузы треугольника */
    .stars {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
    }

    .star {
        position: absolute;
        color: #fff;
        font-size: 22px;
        line-height: 1;
        transform: translate(-50%, -50%);
    }

    /* Плавающие эмоджи-флаги */
    .emoji-float {
        position: fixed;
        font-size: 32px;
        opacity: 0.85;
        animation: float 8s ease-in-out infinite;
        z-index: 0;
        pointer-events: none;
        user-select: none;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-8deg); }
        50% { transform: translateY(-25px) rotate(8deg); }
    }

    /* Основная карточка */
    .card {
        position: relative;
        z-index: 2;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(6px);
        border-radius: 24px;
        padding: 48px 40px;
        max-width: 640px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        border: 3px solid #FECB00;
    }

    .thank-text {
        font-size: clamp(20px, 4vw, 30px);
        font-weight: 700;
        color: #002F6C;
        line-height: 1.5;
        margin-bottom: 32px;
    }

    .thank-text .name {
        color: #b8860b;
        display: inline-block;
    }

    button {
        font-size: 20px;
        font-weight: 700;
        padding: 16px 42px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, #002F6C, #00509e);
        box-shadow: 0 8px 20px rgba(0, 47, 108, 0.45);
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.3s;
    }

    button:hover {
        transform: translateY(-3px) scale(1.04);
        box-shadow: 0 12px 26px rgba(0, 47, 108, 0.6);
    }

    button:active {
        transform: translateY(1px) scale(0.98);
    }

    button:disabled {
        opacity: 0.55;
        cursor: default;
        transform: none;
        box-shadow: 0 8px 20px rgba(0, 47, 108, 0.25);
    }

    /* Блок результата */
    .result {
        display: none;
        margin-top: 8px;
        animation: pop 0.5s ease;
    }

    .result.show {
        display: block;
    }

    @keyframes pop {
        0% { transform: scale(0.6); opacity: 0; }
        70% { transform: scale(1.08); }
        100% { transform: scale(1); opacity: 1; }
    }

    .result-text {
        font-size: clamp(22px, 4.5vw, 32px);
        font-weight: 800;
        color: #1a7f37;
        margin-bottom: 18px;
    }

    .checks {
        display: flex;
        justify-content: center;
        gap: 14px;
        font-size: 40px;
        flex-wrap: wrap;
    }

    .checks span {
        color: #1a7f37;
        animation: checkIn 0.45s ease backwards;
        text-shadow: 0 4px 10px rgba(26, 127, 55, 0.4);
    }

    .checks span:nth-child(1) { animation-delay: 0.05s; }
    .checks span:nth-child(2) { animation-delay: 0.2s; }
    .checks span:nth-child(3) { animation-delay: 0.35s; }
    .checks span:nth-child(4) { animation-delay: 0.5s; }
    .checks span:nth-child(5) { animation-delay: 0.65s; }

    @keyframes checkIn {
        0% { transform: scale(0) rotate(-30deg); opacity: 0; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
    }
</style>
</head>
<body>

    <!-- Фон-флаг -->
    <div class="flag-bg"></div>
    <div class="stars" id="stars"></div>

    <!-- Плавающие эмоджи-флаги -->
    <div class="emoji-float" style="top: 8%;  left: 6%;  animation-delay: 0s;">🇧🇦</div>
    <div class="emoji-float" style="top: 15%; right: 9%; animation-delay: 1.2s;">🇧🇦</div>
    <div class="emoji-float" style="bottom: 12%; left: 12%; animation-delay: 2.4s;">🇧🇦</div>
    <div class="emoji-float" style="bottom: 20%; right: 8%; animation-delay: 0.6s;">🇧🇦</div>
    <div class="emoji-float" style="top: 45%; left: 3%;  animation-delay: 3s;">🇧🇦</div>
    <div class="emoji-float" style="top: 55%; right: 4%; animation-delay: 1.8s;">🇧🇦</div>
    <div class="emoji-float" style="top: 80%; left: 45%; animation-delay: 2s; font-size: 26px;">🇧🇦</div>
    <div class="emoji-float" style="top: 5%;  left: 48%; animation-delay: 3.6s; font-size: 26px;">🇧🇦</div>

    <!-- Карточка -->
    <div class="card">
        <p class="thank-text">
            Спасибо вам за помощь с программой,
            дорогой <span class="name">Никита Сергеевич</span>
        </p>

        <button id="acceptBtn">Принять благодарность</button>

        <div class="result" id="result">
            <div class="result-text">Я отблагодарён</div>
            <div class="checks">
                <span>✔</span><span>✔</span><span>✔</span><span>✔</span><span>✔</span>
            </div>
        </div>
    </div>

<script>
    // Генерация звёзд вдоль диагонали флага
    (function createStars() {
        const container = document.getElementById('stars');
        const count = 14;
        for (let i = 0; i < count; i++) {
            const t = i / (count - 1);          // 0 → 1 вдоль гипотенузы
            const x = 100 - t * 100;            // справа налево
            const y = t * 100;                  // сверху вниз
            const star = document.createElement('div');
            star.className = 'star';
            star.textContent = '★';
            star.style.left = x + '%';
            star.style.top = y + '%';
            container.appendChild(star);
        }
    })();

    // Обработка кнопки
    const btn = document.getElementById('acceptBtn');
    const result = document.getElementById('result');

    btn.addEventListener('click', () => {
        btn.disabled = true;
        btn.textContent = 'Благодарность принята';
        result.classList.add('show');
    });
</script>

</body>
</html>
